[project]
name = "geoask-ai-backend"
version = "0.1.0"
description = "GeoAsk AI — Agentic Multimodal VLM for Remote-Sensing Image Analysis"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "websockets>=12.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "rasterio>=1.3.10",
    "numpy>=1.26.0",
    "Pillow>=10.4.0",
    "scikit-image>=0.24.0",
    "scikit-learn>=1.5.0",
    "scipy>=1.14.0",
    "google-generativeai>=0.8.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "reportlab>=4.2.0",
    "aiofiles>=24.1.0",
    "orjson>=3.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]
gpu = [
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "transformers>=4.44.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
